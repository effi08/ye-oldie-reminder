<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ye Oldie Reminder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8c3b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reminder">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4ead5;--card:#fbf5e6;--ink:#3b2a1a;--mute:#7a6650;--acc:#8c3b1f;--acc2:#2f5d50;--line:#d8c7a3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:2rem;margin:.2em 0 0;letter-spacing:.02em}
.sub{color:var(--mute);margin:0 0 18px;font-style:italic}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 0 rgba(0,0,0,.04)}
h2{font-size:1.05rem;margin:0 0 8px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
label{display:block;font-size:.9rem;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=time],input[type=number],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
button{font:inherit;cursor:pointer;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:10px 14px;margin:4px 6px 4px 0}
button.alt{background:transparent;color:var(--acc)}
button.go{background:var(--acc2);border-color:var(--acc2)}
button.big{font-size:1.15rem;padding:14px 20px}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 120px}
.pill{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--mute);margin-right:6px}
.due{border-color:var(--acc);background:#fff1dc}
.msg{font-size:1.25rem;margin:4px 0 10px}
.rec{color:#b00020;font-weight:bold}
.note{font-size:.85rem;color:var(--mute)}
audio{width:100%;margin-top:8px}
.empty{color:var(--mute);font-style:italic}
.ring{position:fixed;inset:0;z-index:99;background:#8c3b1f;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.ring.on{display:flex;animation:pulse 1.2s infinite}
@keyframes pulse{50%{background:#a8481f}}
.ring h1{font-size:2.2rem;margin:.2em 0}.ring p{font-size:1.2rem;margin:.2em 0 1.2em}
.ring button{font-size:1.6rem;padding:22px 48px;background:#fff;color:#8c3b1f;border:0;border-radius:14px;font-weight:bold;margin:8px}
.arm{background:#fff1dc;border:1px solid var(--acc);border-radius:10px;padding:12px;margin:12px 0}
</style>
</head>
<body>
<div id="ring" class="ring" role="alertdialog"><div style="font-size:3rem">🔔</div><h1 id="ringT"></h1><p id="ringB"></p><button id="ringStop" type="button">■ STOP</button></div>
<div class="wrap">
  <h1>Ye Oldie Reminder</h1>
  <p class="sub">Remembered your way. In your voice, your words, as often as you like.</p>

  <div id="armBox"></div>
  <div id="today"></div>

  <div class="card">
    <h2>New reminder</h2>
    <label>What do you need to remember?</label>
    <input type="text" id="title" placeholder="e.g. Have a glass of water">
    <label>Your words (optional, shown on screen and can be read aloud)</label>
    <textarea id="body" placeholder="e.g. Your kidneys and blood pressure thank you."></textarea>

    <label>Your voice</label>
    <div class="row">
      <button id="recBtn" class="alt" type="button">● Record</button>
      <button id="stopBtn" class="alt" type="button" disabled>■ Stop</button>
      <button id="phoneBtn" class="alt" type="button">🎙 Use phone recorder</button>
      <button id="upBtn" class="alt" type="button">Upload audio</button>
    </div>
    <input type="file" id="file" accept="audio/*" hidden>
    <input type="file" id="cap" accept="audio/*" capture hidden>
    <div id="recStatus" class="note"></div>
    <audio id="preview" controls hidden></audio>

    <div class="row">
      <div><label>Time each day</label><input type="time" id="time" value="09:00"></div>
      <div><label>Seconds between repeats</label><input type="number" id="reps" min="0" max="60" value="2"></div>
    </div>
    <label><input type="checkbox" id="speak"> Speak my words aloud if there is no recording</label>
    <button id="save" class="go big" type="button">Save reminder</button>
    <button id="saveTest" class="alt" type="button">Save &amp; test in 1 minute</button>
    <div id="saveMsg" class="note" role="status" style="margin-top:8px"></div>
    <div class="note" id="micNote"></div>
  </div>

  <div class="card">
    <h2>All reminders</h2>
    <div id="list"></div>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
let db=null, mem=[], blobMem={}, recorder=null, chunks=[], curBlob=null, stream=null;

// ---------- storage (IndexedDB; audio kept as bytes so iPhones store it reliably) ----------
function openDB(){return new Promise(res=>{
  try{const r=indexedDB.open('ye-oldie',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('r',{keyPath:'id'});
    r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res();r.onblocked=()=>res();
  }catch(e){res()}});}
function all(){return new Promise(res=>{
  if(!db)return res(mem.slice());
  try{const q=db.transaction('r').objectStore('r').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res(mem.slice())}catch(e){res(mem.slice())}});}
function put(o){return new Promise((res,rej)=>{
  const keep=()=>{const i=mem.findIndex(x=>x.id===o.id);i<0?mem.push(o):mem[i]=o};
  if(!db){keep();return res(false)}
  try{const t=db.transaction('r','readwrite');t.objectStore('r').put(o);
    t.oncomplete=()=>res(true);t.onerror=()=>{keep();rej(t.error||new Error('write failed'))};t.onabort=()=>{keep();rej(t.error||new Error('write aborted'))}
  }catch(e){keep();rej(e)}});}
function del(id){return new Promise(res=>{
  mem=mem.filter(x=>x.id!==id);
  if(!db)return res();
  try{const t=db.transaction('r','readwrite');t.objectStore('r').delete(id);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}});}
async function blobToRec(b){return b?{buf:await b.arrayBuffer(),type:b.type||'audio/mp4'}:null}
const recToBlob=a=>a?new Blob([a.buf],{type:a.type}):null;

// ---------- recording ----------
$('micNote').textContent='';
$('recBtn').onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];
    const mt=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
    recorder=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);
    recorder.ondataavailable=e=>chunks.push(e.data);
    recorder.onstop=()=>{curBlob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});showPreview();stream.getTracks().forEach(t=>t.stop());$('recStatus').textContent='Recorded. Play it back below, or record again.'};
    recorder.start();
    $('recBtn').disabled=true;$('stopBtn').disabled=false;
    $('recStatus').innerHTML='<span class="rec">● Recording…</span> speak now';
  }catch(e){
    $('recBtn').disabled=false;$('stopBtn').disabled=true;
    const denied=e&&(e.name==='NotAllowedError'||e.name==='SecurityError');
    $('recStatus').textContent=denied?'Microphone blocked. Allow microphone access for this site in your browser settings, or use the phone recorder button.':'Live recording is not available here. Use the phone recorder button.';
  }};
$('phoneBtn').onclick=()=>$('cap').click();
$('cap').onchange=e=>{const f=e.target.files[0];if(!f)return;curBlob=f;showPreview();$('recStatus').textContent='Recording attached.'};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
$('stopBtn').onclick=()=>{if(recorder&&recorder.state==='recording')recorder.stop();$('recBtn').disabled=false;$('stopBtn').disabled=true};
$('upBtn').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;curBlob=f;showPreview();$('recStatus').textContent='Loaded: '+f.name};
function showPreview(){const a=$('preview');a.src=URL.createObjectURL(curBlob);a.hidden=false}

// ---------- save ----------
const pad=n=>String(n).padStart(2,'0');
const fmt=t=>{const[h,m]=t.split(':').map(Number);return (h%12||12)+':'+pad(m)+(h<12?' am':' pm')};
function setMsg(t,ok){const m=$('saveMsg');m.textContent=t;m.style.color=ok?'#2f5d50':'#b00020';m.style.fontWeight='bold'}
async function saveReminder(testIn1){
  const title=$('title').value.trim();
  if(!title){setMsg('Type what you need to remember first.',false);$('title').focus();return}
  let time=$('time').value;
  if(testIn1){const d=new Date(Date.now()+60000);time=pad(d.getHours())+':'+pad(d.getMinutes())}
  if(!time){setMsg('Choose a time first.',false);return}
  const o={id:Date.now().toString(36),title,body:$('body').value.trim(),time,
    reps:Math.max(0,Math.min(60,isNaN(parseInt($('reps').value))?2:parseInt($('reps').value))),speak:$('speak').checked,
    audio:await blobToRec(curBlob),plays:0,lastDone:'',
    lastFired:(!testIn1&&time<=nowHM())?today():''};
  try{
    const stored=await put(o);
    const back=(await all()).find(x=>x.id===o.id);
    if(!back)throw new Error('not found after save');
    const when=o.lastFired?'tomorrow at '+fmt(time):'today at '+fmt(time);
    setMsg('Saved ✓ Your reminder will fire '+when+'. Keep this app open (or installed) at that time.'+(stored?'':' (Storage is unavailable here, so this lasts only until you close the page.)'),true);
  }catch(e){
    setMsg('Could not save on this device ('+(e&&e.name||'error')+'). Try removing the audio, or reopen the app and try again.',false);return}
  $('title').value='';$('body').value='';curBlob=null;$('preview').hidden=true;$('recStatus').textContent='';
  render();
}
$('save').onclick=()=>saveReminder(false);
$('saveTest').onclick=()=>saveReminder(true);

// ---------- ringing: loops until the person presses STOP ----------
const player=new Audio();player.setAttribute('playsinline','');
let armed=false,ringing=null,wake=null,vibT=null,gapT=null;
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
async function arm(){
  if(armed)return;
  try{player.src=SILENT;await player.play();player.pause();armed=true}catch(e){}
  try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){}
  try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission().catch(()=>{})}catch(e){}
  renderArm();
}
document.addEventListener('click',arm,{once:false,capture:true});
document.addEventListener('touchend',arm,{capture:true});
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&armed&&'wakeLock' in navigator){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}});
function renderArm(){$('armBox').innerHTML=armed?'':'<div class="arm"><strong>Tap here once to turn sound on</strong> so reminders can play by themselves.<br><button class="go" id="armBtn" type="button">Turn on sound &amp; keep screen awake</button></div>';const b=$('armBtn');if(b)b.onclick=arm}
function stopRing(markDone){
  const r=ringing;ringing=null;
  try{player.pause();player.loop=false}catch(e){}
  try{speechSynthesis.cancel()}catch(e){}
  clearTimeout(gapT);clearInterval(vibT);try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}
  $('ring').classList.remove('on');document.title='Ye Oldie Reminder';
  if(r&&markDone){r.lastDone=today();put(r).catch(()=>{}).then(render)}
}
function ring(r){
  if(ringing)stopRing(false);
  ringing=r;r.plays=(r.plays||0)+1;put(r).catch(()=>{});
  $('ringT').textContent=r.title;$('ringB').textContent=r.body||'';$('ring').classList.add('on');
  document.title='🔔 '+r.title;
  const gap=(r.reps==null?2:r.reps)*1000;
  const loop=()=>{
    if(ringing!==r)return;
    if(r.audio){
      player.loop=false;player.src=URL.createObjectURL(recToBlob(r.audio));
      player.onended=()=>{gapT=setTimeout(loop,gap)};
      player.play().catch(()=>{});
    }else if(r.speak){
      try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance((r.body||r.title));u.onend=()=>{gapT=setTimeout(loop,gap)};speechSynthesis.speak(u)}catch(e){gapT=setTimeout(loop,gap)}
    }};
  loop();
  try{navigator.vibrate&&navigator.vibrate([400,200,400]);vibT=setInterval(()=>{try{navigator.vibrate([400,200,400])}catch(e){}},3000)}catch(e){}
}
$('ringStop').onclick=()=>stopRing(true);

// ---------- schedule ----------
const today=()=>new Date().toLocaleDateString('en-CA');
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
async function tick(){
  const rs=await all();let changed=false;
  for(const r of rs){
    if(r.time<=nowHM()&&r.lastFired!==today()){
      r.lastFired=today();try{await put(r)}catch(e){}changed=true;
      try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
      try{if(window.Notification&&Notification.permission==='granted'){
        const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
        reg&&reg.showNotification?reg.showNotification('Reminder',{body:r.title,tag:r.id}):new Notification('Reminder',{body:r.title})}}catch(e){}
      ring(r);
    }}
  if(changed)render();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
window.addEventListener('focus',tick);
document.addEventListener('click',function(){try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission().catch(()=>{})}catch(e){}},{once:true});

// ---------- render ----------
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function render(){
  const rs=(await all()).sort((a,b)=>a.time.localeCompare(b.time));
  const td=today(), now=nowHM();
  const due=rs.filter(r=>r.lastFired===td&&r.lastDone!==td);
  const upcoming=rs.filter(r=>r.lastFired!==td);
  let h='';
  if(due.length){
    h+=due.map(r=>`<div class="card due"><h2>Remember now</h2><div class="msg">${esc(r.title)}</div>${r.body?`<div>${esc(r.body)}</div>`:''}
      <button class="go big" data-play="${r.id}">▶ Play again</button>
      <button class="alt" data-done="${r.id}">✓ Done</button></div>`).join('');
  }else if(upcoming.length){
    const nx=upcoming.find(r=>r.time>now)||upcoming[0];
    h=`<div class="card"><h2>Next up</h2><div class="msg">${esc(nx.title)}</div><span class="pill">${nx.time}</span><span class="note">Keep this page open to be alerted.</span></div>`;
  }else if(rs.length){h='<div class="card"><h2>Today</h2>All done. Well kept.</div>'}
  $('today').innerHTML=h;
  $('list').innerHTML=rs.length?rs.map(r=>`<div style="padding:10px 0;border-top:1px solid var(--line)">
    <strong>${esc(r.title)}</strong><br>
    <span class="pill">${r.time} daily</span><span class="pill">${r.audio?'voice':r.speak?'read aloud':'text'}</span><span class="pill">played ${r.plays||0}×</span>
    <div>${r.audio?'<button class="alt" data-play="'+r.id+'">▶ Replay</button>':r.speak?'<button class="alt" data-play="'+r.id+'">▶ Read aloud</button>':''}
    <button class="alt" data-test="${r.id}">Test now</button><button class="alt" data-del="${r.id}">Delete</button></div></div>`).join(''):'<div class="empty">Nothing yet. Add your first reminder above.</div>';
  document.querySelectorAll('[data-play]').forEach(b=>b.onclick=async()=>{const r=(await all()).find(x=>x.id===b.dataset.play);if(r)ring(r)});
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=async()=>{const r=(await all()).find(x=>x.id===b.dataset.done);if(r)done(r)});
  document.querySelectorAll('[data-test]').forEach(b=>b.onclick=async()=>{const r=(await all()).find(x=>x.id===b.dataset.test);if(r){r.lastDone='';r.lastFired=today();try{await put(r)}catch(e){}render();ring(r)}});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await del(b.dataset.del);render()});
}

openDB().then(()=>{renderArm();render();tick();setInterval(tick,5000)});
})();
</script>
</body>
</html>
